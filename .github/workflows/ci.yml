name: 'Continuous Integration'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: make install
             pip install "anyio<4"
             pip install "pytest==7.4.4"

      - name: Run API tests
        run: make api-test

      - name: Run model tests
        run: make model-test